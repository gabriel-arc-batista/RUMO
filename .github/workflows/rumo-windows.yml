name: Build and verify RUMO Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build and verification tools
        run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt
      - name: Check source and tests
        run: |
          python -m black --check .
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
          python scripts/verify_rpg_gui.py
          python scripts/verify_rpg_dialogs.py
          python scripts/verify_appearance_gui.py
          python scripts/verify_gui.py
          python scripts/verify_modern_ui.py
          python scripts/verify_performance.py
      - name: Build native Windows executable and installer
        shell: pwsh
        run: |
          $env:ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $env:ISCC)) { choco install innosetup --no-progress -y }
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/RUMO-Instalar-Windows.exe)) { throw 'Installer missing' }
      - name: Verify executable, persistence, offline runtime and installer
        run: |
          python scripts/verify_distribution.py
          python scripts/verify_installer.py
      - name: Verify packaged names and generate checksums
        run: python scripts/verify_brand_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RUMO-Windows-1.0.0
          path: |
            dist/RUMO-Instalar-Windows.exe
            dist/RUMO-Windows-Portatil.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
