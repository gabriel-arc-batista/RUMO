name: Build and verify RUMO Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build and verification tools
        run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt
      - name: Check source and tests
        shell: bash
        run: |
          python -m black --check .
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
          python scripts/verify_upgrade.py self-test
          python scripts/verify_sync_gui.py
          python scripts/verify_design.py
          python scripts/verify_rpg_gui.py
          python scripts/verify_rpg_dialogs.py
          python scripts/verify_appearance_gui.py
          python scripts/verify_gui.py
          python scripts/verify_modern_ui.py
          python scripts/verify_subtopic_clicks.py
          python scripts/verify_performance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify optional frontend source
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        working-directory: web
        shell: bash
        run: |
          node --version
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Build native Windows executable and installer
        shell: pwsh
        run: |
          $env:ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $env:ISCC)) { choco install innosetup --no-progress -y }
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/RUMO-Instalar-Windows.exe)) { throw 'Installer missing' }
      - name: Verify executable, persistence, offline runtime and installer
        shell: bash
        run: |
          python scripts/verify_distribution.py
          python scripts/verify_installer.py
      - name: Verify packaged names and generate checksums
        run: python scripts/verify_brand_package.py
      - name: Reject private data and development dependencies in portable package
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('dist/RUMO-Windows-Portatil.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not set(path.parts) & {'node_modules', 'validation', '.git', 'backups'}, name
                  assert not path.name.startswith('.env'), name
                  assert path.suffix.lower() not in {'.sqlite', '.sqlite3', '.db', '.log'}, name
                  assert path.name.lower() not in {'credentials.json', 'tokens.json', 'account-sync.sqlite3'}, name
          print('Portable package contains no forbidden private files.')
          PY
      - name: Read release version
        id: release
        shell: bash
        run: python -c "import os; from scripts.verify_upgrade import release_version; open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + release_version() + '\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RUMO-Windows-${{ steps.release.outputs.version }}
          path: |
            dist/RUMO-Instalar-Windows.exe
            dist/RUMO-Windows-Portatil.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
